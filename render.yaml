# Décrit les ressources à créer automatiquement sur Render.
databases:
  # Base PostgreSQL utilisée par l'application FamilyTask.
  - name: familytask-db
    plan: free
    databaseName: familytask
    user: familytask

services:
  # API web Python de l'application FamilyTask.
  - type: web
    name: familytask-api
    runtime: python
    plan: free
    # Les chemins sont explicites car Render lance cette commande depuis la racine.
    buildCommand: pip install -r familytask/backend/requirements.txt
    startCommand: uvicorn familytask.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render injecte automatiquement l'URL de connexion de la base déclarée ci-dessus.
      - key: DATABASE_URL
        fromDatabase:
          name: familytask-db
          property: connectionString
      # La clé IA doit être ajoutée comme secret dans le tableau de bord Render.
      - key: AI_TOKEN
        sync: false
  # Frontend statique Vue de l'application FamilyTask.
  - type: web
    name: familytask-front
    runtime: static
    rootDir: familytask/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Récupère l'hôte public de l'API pour les appels du frontend.
      - key: VITE_API_URL
        fromService:
          type: web
          name: familytask-api
          property: host
    routes:
      # Redirige les routes Vue vers l'application principale en cas d'accès direct.
      - type: rewrite
        source: /*
        destination: /index.html
